[loggers]
keys=root,AnalysisMethods,ImageUtilities,InitializeScripts,TimeExperiment,InitializeImageUtils,FileIO,InitializeGeneralUtils

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=defaultFormatter

[logger_root]
level=INFO
handlers=consoleHandler,fileHandler

[logger_AnalysisMethods]
level=INFO
handlers=
qualname=AnalysisMethods
propagate=1

[logger_ImageUtilities]
level=INFO
handlers=
qualname=ImageUtilities
propagate=1

[logger_InitializeScripts]
level=INFO
handlers=
qualname=InitializeScripts
propagate=1

[logger_TimeExperiment]
level=INFO
handlers=
qualname=TimeExperiment
propagate=1

[logger_InitializeImageUtils]
level=INFO
handlers=
qualname=InitializeImageUtils
propagate=1

[logger_FileIO]
level=INFO
handlers=
qualname=FileIO
propagate=1

[logger_InitializeGeneralUtils]
level=INFO
handlers=
qualname=InitializeGeneralUtils
propagate=1

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=defaultFormatter
args=(sys.stderr,)

[handler_fileHandler]
class=handlers.TimedRotatingFileHandler
level=INFO
formatter=defaultFormatter
args=('%(logdir)s/application_%(logdate)s.log', 'midnight', 1, 30, 'utf-8')

[formatter_defaultFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S